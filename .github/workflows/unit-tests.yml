name: Unit tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and run all offline NUnit 5 suites
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: unit-tests-test-build-and-run-all-offline-nunit-5-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: TestResults/**/*.trx
      - name: Verify the library package
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: unit-tests-test-verify-the-library-package
      - name: Verify packaged XML and release documents
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: unit-tests-test-verify-packaged-xml-and-release-documents
