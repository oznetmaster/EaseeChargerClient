name: HTML documentation
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build, verify and retain standard documentation
      uses: oznetmaster/BuildAutomation/.github/actions/documentation-build@c650afeb23c584d68580440ef0f7baaf737cdfd0
      with:
        site: docfx_project/_site
        configure-pages: 'false'
        artifact-name: html-documentation
        upload-pages: ${{ github.event_name != 'pull_request' }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy documentation
      id: deployment
      uses: oznetmaster/BuildAutomation/.github/actions/documentation-deploy@c650afeb23c584d68580440ef0f7baaf737cdfd0
      with:
        attempts: '1'
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
